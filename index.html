<style id="kn-painel-visual">
/* Visual Painel KN · Controle de Diaristas — © 2026 Isis Costa de Mello */
:root{
  --bg:#07090d; --ink:#eef2f5; --muted:#8c97a3; --line:rgba(255,255,255,.09); --glass:rgba(22,27,34,.55);
  --accent:#4cc3ff; --amber:#ffb547; --red:#ff6b6e; --green:#3ddc97; --violet:#a58bff;
  --wash:rgba(255,255,255,.045); --sep:rgba(255,255,255,.06); --line2:rgba(255,255,255,.25); --ph:rgba(255,255,255,.22);
  --navbg:rgba(7,9,13,.72); --overlay:rgba(3,5,8,.72); --modal:rgba(14,18,24,.97); --on-accent:#04121b; --pill:#eef2f5; --on-pill:#000;
  --grain:rgba(255,255,255,.035); --shadow:none; --a1:.10; --a2:.16; --a3:.3;
  /* apelidos usados pelo código antigo */
  --blue:var(--accent); --blue-light:var(--accent); --cyan:var(--accent); --navy:var(--ink); --yellow:var(--amber);
  --gray:var(--muted); --dark:var(--ink); --white:var(--glass); --panel:var(--glass);
  --f-display:'Unbounded',system-ui,sans-serif; --f-sans:'Onest',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:dark;
}
html[data-tema="claro"]{
  --bg:#f4f8fc; --ink:#082b4a; --muted:#647e95; --line:#d7e5f1; --glass:#ffffff;
  --accent:#0b7fe8; --amber:#b45f06; --red:#d33b40; --green:#128a58; --violet:#6d4fd8;
  --wash:rgba(8,43,74,.04); --sep:rgba(8,43,74,.08); --line2:rgba(8,43,74,.28); --ph:rgba(8,43,74,.35);
  --navbg:rgba(255,255,255,.88); --overlay:rgba(8,43,74,.35); --modal:#ffffff; --on-accent:#ffffff; --pill:#082b4a; --on-pill:#ffffff;
  --grain:rgba(8,43,74,.05); --shadow:0 10px 32px rgba(28,73,111,.07); --a1:.07; --a2:.07; --a3:.08;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);transition:background-color .25s ease}
body{margin:0;font-family:var(--f-sans);font-size:14px;line-height:1.45;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(40px)}
.aurora i:nth-child(1){width:46vw;height:46vw;left:-12vw;top:-14vw;background:#0e6d9c;opacity:var(--a1)}
.aurora i:nth-child(2){width:38vw;height:38vw;right:-10vw;top:18vh;background:#b86b12;opacity:var(--a2)}
.aurora i:nth-child(3){width:50vw;height:40vw;left:30vw;bottom:-22vw;background:#123f7a;opacity:var(--a3)}
.grain{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(var(--grain) 1px,transparent 1px);background-size:22px 22px}
.tnum,td,.value,.kn-clock{font-variant-numeric:tabular-nums}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.noscroll::-webkit-scrollbar{display:none}.noscroll{scrollbar-width:none}
select option{background:var(--modal);color:var(--ink)}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ===== Navegação fixa ===== */
#topnav{position:fixed;top:0;left:0;right:0;z-index:50;padding-top:env(safe-area-inset-top,0px);background:var(--navbg);border-bottom:1px solid var(--line);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3)}
#topnav .navin{max-width:1280px;margin:0 auto;padding:0 16px;height:56px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:8px;flex-shrink:0;cursor:default;user-select:none}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.brand .nm{font-family:var(--f-display);font-size:13px;letter-spacing:-.01em;font-weight:500}
.brand .nm span{color:var(--muted);font-family:var(--f-sans);font-weight:500}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;color:#fff;background:#16a34a;white-space:nowrap;flex-shrink:0}
.live.off{background:#d33b40}.live.wait{background:#d97706}
#nav{margin-left:auto;display:flex;gap:4px;overflow-x:auto;padding:4px;border-radius:999px;background:var(--wash);scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
.nav-item{position:relative;flex-shrink:0;padding:6px 16px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;transition:color .15s,background-color .2s;border:0;background:transparent;font-family:inherit}
.nav-item:hover{color:var(--ink)}
.nav-item.active{background:var(--pill);color:var(--on-pill)}
.nav-item .ic{display:none}
.icon-btn{flex-shrink:0;width:36px;height:36px;border-radius:50%;border:0;background:var(--wash);color:var(--muted);font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-family:inherit}
.icon-btn:hover{color:var(--ink)}

/* ===== Área principal ===== */
#main{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:88px 16px 40px}
#pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:8px 4px 20px}
#pagehead .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);font-weight:600}
#pageTitle{font-family:var(--f-display);font-weight:500;font-size:clamp(28px,4.4vw,48px);letter-spacing:-.03em;line-height:1.02;margin:6px 0 0;text-wrap:balance}
#topMeta{font-size:13px;color:var(--muted);max-width:520px}
#content{position:relative}
.sig{position:relative;z-index:1;text-align:center;font-size:12px;color:var(--muted);padding:8px 16px 32px}
.sig button{appearance:none;border:0;background:transparent;padding:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer}
.sig button:hover{text-decoration:underline}
.sig .ver{display:block;font-size:11px;opacity:.8;margin-top:2px;font-family:var(--f-mono)}

/* ===== Cartões de vidro ===== */
.panel,.card,.chart-box{background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:24px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.panel{padding:22px 24px;margin-bottom:16px;min-width:0}
.panel h2{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);font-weight:600;margin:0 0 16px}
.panel h3{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted)!important;font-weight:600;margin:18px 0 10px!important}
.panel>h3:first-child{margin-top:0!important}
.cards-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:16px}
.card{padding:18px 20px;position:relative;overflow:hidden;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--line2)}
.card .label{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);font-weight:600}
.card .value{font-family:var(--f-display);font-weight:500;font-size:34px;letter-spacing:-.03em;line-height:1;margin-top:10px;color:var(--ink)}
.card.meli .value{color:var(--amber)}.card.kn .value{color:var(--green)}.card.total .value{color:var(--accent)}

/* KPIs do dashboard */
.kn-kpis{grid-template-columns:repeat(6,minmax(0,1fr))}
.kn-kpis .card{--accent-k:var(--accent);padding:16px 18px 10px}
.kn-kpis .khead{display:flex;justify-content:space-between;align-items:center}
.kn-kpis .khead span{display:none}
.kn-kpis .kicon{width:32px;height:32px;border-radius:12px;display:grid;place-items:center;font-size:15px;background:color-mix(in srgb,var(--kc) 14%,transparent);color:var(--kc)}
.kn-kpis .label{margin-top:12px}
.kn-kpis .value{color:var(--kc);font-size:36px;margin-top:6px}
.mini-line{display:block;height:30px;width:100%;margin-top:8px;overflow:visible}
.mini-line path.line{fill:none;stroke:var(--kc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.mini-line path.area{fill:color-mix(in srgb,var(--kc) 12%,transparent);stroke:none}

/* Cabeçalho do dashboard */
.dash-hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.dash-hero .panel{margin:0}
.hero-main{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hero-main .kn-day{font-size:13px;color:var(--muted)}
.hero-main .kn-day b{color:var(--ink);font-weight:600}
.kn-clock{font-family:var(--f-display);font-weight:500;font-size:clamp(44px,6vw,72px);letter-spacing:-.04em;line-height:.95;color:var(--ink)}
.kn-quote{font-size:13px;color:var(--muted);text-align:right;line-height:1.4}
.kn-quote small{display:block;margin-top:4px;font-size:10px;letter-spacing:.2em;font-weight:600;color:var(--accent)}
.hero-side{display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.hero-stats{display:flex;gap:8px;flex-wrap:wrap}
#quickResult .alert{margin-top:12px}

/* Tabela do dia */
.kn-table-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.kn-table-head h2{margin:0}
.kn-table-search{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
.kn-table-search .searchbox{width:300px;max-width:100%}
.status-present,.status-pending{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.status-present{background:color-mix(in srgb,var(--green) 12%,transparent);color:var(--green)}
.status-pending{background:color-mix(in srgb,var(--amber) 13%,transparent);color:var(--amber)}

/* ===== Botões ===== */
button{cursor:pointer;font-family:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:var(--on-accent);border:1px solid transparent;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;line-height:1.2;transition:filter .15s,border-color .15s,background-color .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:default}
.btn.secondary{background:transparent;color:var(--ink);border-color:var(--line);font-weight:500}
.btn.secondary:hover{border-color:var(--line2);filter:none}
.btn.yellow{background:var(--amber);color:#1a1000}
html[data-tema="claro"] .btn.yellow{color:#fff}
.btn.danger,.btn.secondary.danger{background:transparent;color:var(--red)!important;border-color:color-mix(in srgb,var(--red) 35%,transparent)!important}
.btn.danger:hover{background:color-mix(in srgb,var(--red) 10%,transparent);filter:none}
.btn.sm{padding:5px 12px;font-size:12px}
.btn.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn[style*="var(--red)"]{background:transparent}
.link{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:500}
.link:hover{text-decoration:underline}

/* ===== Campos ===== */
input,select,textarea{font-family:inherit;font-size:14px;padding:9px 14px;border:1px solid var(--line);border-radius:16px;background:var(--wash);color:var(--ink);transition:border-color .15s;max-width:100%}
input::placeholder,textarea::placeholder{color:var(--ph)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
input[type=checkbox],input[type=radio]{width:16px;height:16px;padding:0;accent-color:var(--accent);vertical-align:middle}
input[type=date]{min-height:40px}
input[type=file]{border-style:dashed}
label{font-size:12px;color:var(--muted);font-weight:500;display:block;margin-bottom:6px}
.field{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.searchbox{width:100%;padding:11px 16px;font-size:14px;border-radius:999px}
.dist-input,.abs-input{padding:5px 10px!important;border-radius:12px!important;font-size:13px!important;text-align:center}

/* ===== Tabelas ===== */
.table-wrap{overflow-x:auto;border-radius:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);padding:10px 12px;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--line);white-space:nowrap;background:transparent}
td{padding:10px 12px;border-bottom:1px solid var(--sep);white-space:nowrap;color:var(--ink)}
tbody tr{transition:background-color .12s}
tbody tr:hover td{background:var(--wash)}
tbody tr:last-child td{border-bottom:0}
table.table-compact{width:auto;min-width:100%}
table.table-compact th,table.table-compact td{padding:9px 10px}
.abs-table th,.abs-table td{font-size:12px!important;padding:7px 9px!important}
.abs-table .abs-date-start td{border-top:1px solid color-mix(in srgb,var(--accent) 40%,transparent)!important;background:color-mix(in srgb,var(--accent) 6%,transparent)}
.abs-table .abs-date-start td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.colcopy{cursor:pointer;opacity:.4;font-size:11px;margin-left:4px;user-select:none;color:var(--accent)}
.colcopy:hover{opacity:1}
.rowSel{accent-color:var(--accent)}

/* ===== Pílulas ===== */
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;background:var(--wash);color:var(--muted)}
.pill.ativo,.pill.encontrado{background:color-mix(in srgb,var(--green) 12%,transparent);color:var(--green)}
.pill.inativo,.pill.duplicidade{background:color-mix(in srgb,var(--red) 13%,transparent);color:var(--red)}
.pill.novo{background:color-mix(in srgb,var(--amber) 13%,transparent);color:var(--amber)}
.pill.empresa{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent)}
.pill.empresa.meli{background:color-mix(in srgb,var(--amber) 13%,transparent);color:var(--amber)}
.pill.empresa.kn{background:color-mix(in srgb,var(--green) 12%,transparent);color:var(--green)}
.pill.empresa.tsi{background:color-mix(in srgb,var(--violet) 14%,transparent);color:var(--violet)}
.chip{display:inline-flex;align-items:center;background:var(--wash);border:1px solid var(--line);padding:4px 11px;border-radius:999px;font-size:12px;margin:2px;color:var(--ink)}
.badge-count{background:var(--amber);color:#1a1000;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;margin-left:6px}

/* ===== Alertas e toast ===== */
.alert{padding:11px 16px;border-radius:16px;font-size:13px;margin-bottom:12px;display:flex;gap:8px;align-items:flex-start;background:var(--wash);color:var(--ink)}
.alert.ok{background:color-mix(in srgb,var(--green) 12%,transparent);color:var(--green)}
.alert.warn{background:color-mix(in srgb,var(--amber) 13%,transparent);color:var(--amber)}
.alert.err{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red)}
.alert.info{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.alert b,.alert strong{color:inherit}
.kn-toast{position:fixed!important;left:50%!important;right:auto!important;bottom:24px!important;transform:translateX(-50%);z-index:999!important;min-width:0!important;max-width:min(560px,calc(100vw - 32px));border-radius:999px!important;padding:11px 20px!important;background:var(--modal)!important;border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.35)!important;backdrop-filter:blur(14px);animation:toastIn .25s ease;font-weight:500}
.kn-toast.ok{color:var(--green)!important}.kn-toast.warn{color:var(--amber)!important}.kn-toast.err{color:var(--red)!important}.kn-toast.info{color:var(--ink)!important}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

/* ===== Modais ===== */
.modal-bg{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;animation:fadeIn .18s ease}
.modal{background:var(--modal);color:var(--ink);border:1px solid var(--line);border-radius:28px;width:500px;max-width:100%;max-height:88vh;overflow:auto;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.45);animation:popIn .22s cubic-bezier(.2,.9,.3,1.2)}
.modal h3{margin-top:0;font-family:var(--f-display);font-weight:500;font-size:20px;letter-spacing:-.02em;color:var(--ink)}
.modal-close{float:right;cursor:pointer;font-size:20px;color:var(--muted);width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--wash);line-height:1}
.modal-close:hover{color:var(--ink)}
.diarista-modal{width:540px}
.diarista-modal .modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.diarista-modal .modal-title{font-family:var(--f-display);font-weight:500;font-size:20px;letter-spacing:-.02em}
.diarista-modal .modal-subtitle{font-size:12px;color:var(--muted);margin-top:4px}
.diarista-modal .modal-close{float:none}
.modal-theme-row{display:none!important}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}

/* Sobre o sistema */
.about-isis{width:min(460px,100%)}
.about-isis h3{margin:0 0 4px}
.about-isis .about-project{font-size:12px;color:var(--muted);margin-bottom:18px;text-transform:uppercase;letter-spacing:.16em;font-weight:600}
.about-isis .about-box{border:1px solid var(--line);background:var(--wash);border-radius:20px;padding:16px 18px;margin:10px 0;font-size:14px;line-height:1.7}
.about-isis strong{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.14em;font-weight:600}
.about-isis .copyright{text-align:center;color:var(--muted);font-size:11px;margin-top:16px}

/* ===== Abas internas ===== */
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--wash);margin-bottom:16px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tab{padding:6px 16px;font-size:13px;color:var(--muted);cursor:pointer;border-radius:999px;font-weight:500;white-space:nowrap;transition:color .15s}
.tab:hover{color:var(--ink)}
.tab.active{background:var(--pill);color:var(--on-pill)}

/* ===== Importação ===== */
.stepper{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.step{flex:1;min-width:120px;text-align:center;padding:8px 10px;font-size:12px;color:var(--muted);border-radius:999px;background:var(--wash);font-weight:500;border:1px solid transparent}
.step.active{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.step.done{color:var(--green);background:color-mix(in srgb,var(--green) 10%,transparent)}
.dropzone{border:1.5px dashed var(--line2);border-radius:24px;padding:36px;text-align:center;color:var(--muted);cursor:pointer;background:var(--wash);transition:border-color .15s}
.dropzone:hover{border-color:var(--accent);color:var(--ink)}
.import-status-white{background:var(--wash)!important;border:1px solid var(--line)!important;box-shadow:none!important}

/* ===== QR Code ===== */
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.qr-item{background:var(--glass)!important;border:1px solid var(--line)!important;border-radius:24px!important;padding:16px!important;text-align:center;cursor:pointer;transition:border-color .15s}
.qr-item:hover{border-color:var(--line2)!important}
.qr-item.sel{border-color:var(--accent)!important;box-shadow:0 0 0 1px var(--accent) inset!important}

<script>
/* ===================== SUPABASE CONNECTION ===================== */
const SUPABASE_URL = 'https://wimqujskqgabjboihiei.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_9fcTqUHHJK8R3ebe_l1lXQ_LQwmWWlI';
let sb = null;
try{
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}catch(e){
  console.error('Falha ao iniciar conexao com o banco (Supabase):', e);
}

const COLUNAS_PUBLICAS = {
  diaristas: 'id,nome,empresa,groot_id,ext,cargo,status,nome_normalizado,created_at,updated_at',
  historico_diarias: 'id,diarista_id,data,dia_semana,turno,horario_entrada,nome,groot_id,empresa,cargo,ldap,qr_entrada_batida_em,qr_saida_batida_em,created_at,observacao',
};
async function sbSelect(table){
  if(isAdmin()){
    const r = await sb.rpc('kn_dia_read', {p_senha:ADMIN_SENHA, p_tabela:table});
    if(!r.error && Array.isArray(r.data)) return r.data;
    if(r.data && r.data.erro){ ADMIN_SENHA=null; try{sessionStorage.removeItem('kn-dia-s');}catch(e){} toast(r.data.erro,'err'); }
  }
  const {data, error} = await sb.from(table).select(COLUNAS_PUBLICAS[table] || '*');
  if(error){ console.error('Erro ao carregar '+table, error); toast('Erro ao carregar dados do banco ('+table+'): '+error.message,'err'); return []; }
  return data || [];
}
// Busca um diarista direto no banco pelo CPF (não depende da lista DIARISTAS carregada em memória,
// que pode estar desatualizada se o cadastro foi feito depois que a página foi aberta).
async function sbFindDiaristaByCPF(cpf){
  const n = normalizeCPF(cpf);
  if(!n || !isAdmin()) return null;
  { const lista = await sbSelect('diaristas'); return lista.find(d=>normalizeCPF(d.cpf)===n) || null; }
  const {data, error} = await sb.from('diaristas').select('*').eq('cpf', n).limit(1);
  if(error){ console.error('Erro ao buscar diarista por CPF no banco', error); return null; }
  return (data && data[0]) || null;
}
/* ===================== ACESSO: CONSULTA x ADMINISTRAÇÃO =====================
   Sem senha o app abre só para consulta (pesquisar e baixar arquivos).
   Toda gravação passa pela função kn_dia_write do banco, que confere a senha
   lá no Supabase — a senha não fica escrita neste arquivo. */
let ADMIN_SENHA = null; /* versão somente leitura: não aceita senha */
function isAdmin(){ return !!ADMIN_SENHA; }
function sairAdmin(silencioso){
  ADMIN_SENHA = null;
  try{ sessionStorage.removeItem('kn-dia-s'); }catch(e){}
  if(!silencioso) toast('Saiu da administração. Modo consulta ativo.','info');
  if(typeof boot==='function') boot();
}
async function kdw(table, acao, id, dados){
  if(!isAdmin()){ toast('Ação não disponível.','warn'); return {erro:true}; }
  const {data, error} = await sb.rpc('kn_dia_write', {p_senha:ADMIN_SENHA, p_tabela:table, p_acao:acao, p_id:id==null?null:String(id), p_dados:dados==null?null:dados});
  if(error){ console.error('Erro ao gravar em '+table, error); toast('Erro ao gravar ('+table+'): '+error.message,'err'); return {erro:true}; }
  if(data && data.erro){ toast(data.erro,'err'); sairAdmin(true); return {erro:true}; }
  return {data};
}
async function sbInsert(table, row){ const r = await kdw(table,'insert',null,row); return r.erro ? null : r.data; }
async function sbInsertMany(table, rows){ if(!rows.length) return []; const r = await kdw(table,'insert_many',null,rows); return r.erro ? [] : (r.data||[]); }
async function sbUpdate(table, id, patch){ const r = await kdw(table,'update',id,patch); return r.erro ? null : r.data; }
async function sbDelete(table, id){ if(!isAdmin()) return false; const r = await kdw(table,'delete',id,null); return !r.erro; }

let DIARISTAS = [];
let HISTORICO = [];
let IMPORTS = [];
let DIST_DIARIA = []; // [{id, data, meli, kn, updated_at}] - divisão diária MELI x KN decidida com o cliente
let LOADED = false;

function distDia(dataISO){
  return DIST_DIARIA.find(d=>d.data===dataISO);
}

async function salvarDistribuicaoDia(dataISO, meli, kn){
  const patch = {meli, kn, updated_at:new Date().toISOString()};
  const existente = distDia(dataISO);
  if(existente){
    const upd = await sbUpdate('distribuicao_diaria', existente.id, patch);
    if(!upd) return false;
    Object.assign(existente, patch);
  } else {
    const inserted = await sbInsert('distribuicao_diaria', {data:dataISO, ...patch});
    if(!inserted) return false;
    DIST_DIARIA.push(inserted);
  }
  return true;
}

// Liga os inputs .dist-input de um container: ao editar MELI ou KN de um dia,
// calcula automaticamente o restante para a outra empresa (com base no Total do dia) e salva.
function attachDistInputHandler(container){
  container.addEventListener('change', async (e)=>{
    const inp = e.target.closest('.dist-input');
    if(!inp) return;
    const dataISO = inp.dataset.data;
    const total = parseInt(inp.dataset.total)||0;
    let val = parseInt(inp.value);
    if(isNaN(val) || val<0) val = 0;
    if(val>total) val = total;
    inp.value = val;
    const outro = total - val;
    const campo = inp.dataset.campo;
    const outroCampo = campo==='meli' ? 'kn' : 'meli';
    const outroInput = container.querySelector(`.dist-input[data-data="${CSS.escape(dataISO)}"][data-campo="${outroCampo}"]`);
    if(outroInput) outroInput.value = outro;
    const meli = campo==='meli' ? val : outro;
    const kn = campo==='kn' ? val : outro;
    const ok = await salvarDistribuicaoDia(dataISO, meli, kn);
    if(ok) toast('Distribuição de '+fmtDateBR(dataISO)+' salva.','ok');
  });
}


/* ===================== UTILS ===================== */
function uid(){ return 'id_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function onlyDigits(s){ return (s||'').toString().replace(/\D/g,''); }
function normalizeCPF(s){ return onlyDigits(s); }
function formatCPF(cpf){
  if(!cpf && typeof isAdmin==='function' && !isAdmin()) return '•••.•••.•••-••';
  const d = onlyDigits(cpf);
  if(d.length!==11) return cpf || '';
  return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4');
}
function maskCPF(cpf){
  const d = onlyDigits(cpf);
  if(d.length!==11) return cpf||'';
  return d.slice(0,3)+'.***.***-'+d.slice(9);
}
function normalizeName(s){
  return (s||'').toString()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toUpperCase().replace(/\s+/g,' ').trim();
}
const DIAS_SEMANA = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
function diaSemana(dataISO){
  const [y,m,d] = dataISO.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return DIAS_SEMANA[dt.getDay()];
}
function fmtDateBR(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function toast(msg, type){
  const el = document.createElement('div');
  el.className = 'alert kn-toast '+(type||'info');
  el.style.position='fixed'; el.style.bottom='20px'; el.style.right='20px'; el.style.zIndex=999; el.style.minWidth='260px';
  el.style.boxShadow='0 4px 14px rgba(0,0,0,.15)';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtBatida(iso, dataISO){
  if(!iso) return '-';
  const d = new Date(iso); if(isNaN(d)) return '-';
  const h = d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  const dia = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  return (dataISO && dia!==dataISO) ? h+' ('+d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+')' : h;
}
function diasComLancamento(){
  return Array.from(new Set(HISTORICO.map(h=>h.data).filter(Boolean))).sort().reverse();
}
function dataPadraoDash(){
  const hoje = todayISO();
  if(HISTORICO.some(h=>h.data===hoje)) return hoje;
  const ant = diasComLancamento().find(d=>d<=hoje);
  return ant || hoje;
}
function fmtHora(iso){
  if(!iso) return '-';
  try{
    const d = new Date(iso);
    return d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  }catch(e){ return '-'; }
}

function findDiaristaByCPF(cpf){
  const n = normalizeCPF(cpf);
  if(!n) return null;
  return DIARISTAS.find(d=>normalizeCPF(d.cpf)===n) || null;
}
function findDiaristaByName(nome){
  const n = normalizeName(nome);
  if(!n) return null;
  return DIARISTAS.find(d=>normalizeName(d.nome)===n) || null;
}

/* ===================== AGGREGATIONS ===================== */
function registrosDoDia(dataISO){
  return HISTORICO.filter(h=>h.data===dataISO);
}
function agregarDia(dataISO){
  const regs = registrosDoDia(dataISO);
  const agg = {total:regs.length, MELI:0, KN:0, TSI:0, T1:0, T2:0, T3:0};
  regs.forEach(r=>{
    if(agg[r.empresa]!==undefined) agg[r.empresa]+=1; else agg[r.empresa]=(agg[r.empresa]||0)+1;
    if(agg[r.turno]!==undefined) agg[r.turno]+=1;
  });
  return agg;
}
function empresasUsadas(){
  const s = new Set(['TSI','MELI','KN','HD']);
  DIARISTAS.forEach(d=>d.empresa && s.add(d.empresa));
  HISTORICO.forEach(h=>h.empresa && s.add(h.empresa));
  return Array.from(s);
}

/* ===================== IMPORTAR LISTAGEM ===================== */
const FIELD_ALIASES = {
  nome: ['nome','nome completo','diarista','colaborador','funcionario','funcionário'],
  cpf: ['cpf','cpf do diarista','documento','doc'],
  turno: ['turno'],
  horario_entrada: ['horario','horário','entrada','horario de entrada','horário de entrada','hora'],
  empresa: ['empresa'],
  groot_id: ['groot id','grootid','groot','id groot'],
  cargo: ['cargo','função','funcao'],
  data: ['data','dia'],
};
function guessField(header){
  const h = normalizeName(header).toLowerCase();
  for(const [field, aliases] of Object.entries(FIELD_ALIASES)){
    if(aliases.some(a=>h===a || h.includes(a))) return field;
  }
  return '';
}
function parseCSVText(text){
  const delim = text.includes('\t') ? '\t' : (text.split('\n')[0].split(';').length>1 ? ';' : ',');
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length);
  return lines.map(l=>l.split(delim).map(c=>c.trim().replace(/^"|"$/g,'')));
}
// Detecta se a primeira linha colada/importada parece ser um valor de dado (ex: um CPF)
// em vez de um título de coluna — evita perder a primeira linha quando a lista não tem cabeçalho.
function inferFieldFromValue(cell){
  const c = String(cell||'').trim();
  if(!c) return '';
  const d = onlyDigits(c);
  if(d.length===11) return 'cpf';
  if(/^T[123]$/i.test(c)) return 'turno';
  if(/^\d{1,2}:\d{2}$/.test(c)) return 'horario_entrada';
  if(/^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}$/.test(c) || /^\d{4}-\d{2}-\d{2}$/.test(c)) return 'data';
  if(/^\d{4,8}$/.test(d)) return 'groot_id';
  if(/[A-Za-zÀ-ÿ]/.test(c) && c.trim().includes(' ')) return 'nome';
  return '';
}
function rowLooksLikeData(row){
  return row.some(cell=>{
    if(guessField(cell)) return false; // combina com um rótulo de coluna conhecido — não conta como "dado"
    return inferFieldFromValue(cell)!=='';
  });
}
function splitHeaderAndData(allRows, forceHeaderless){
  if(!allRows || !allRows.length) return {headers:[], rawRows:[], headerless:false};
  const first = allRows[0];
  const temHeaderConhecido = first.some(cell=>guessField(cell)!=='');
  const headerless = forceHeaderless===true || (!temHeaderConhecido && forceHeaderless!==false && rowLooksLikeData(first));
  if(headerless){
    const labels = {nome:'Nome (detectado)', cpf:'CPF (detectado)', turno:'Turno (detectado)', horario_entrada:'Horário (detectado)', data:'Data (detectado)', groot_id:'GROOT ID (detectado)'};
    const headers = first.map((cell,i)=>{ const f=inferFieldFromValue(cell); return labels[f] || ('Coluna '+(i+1)); });
    return {headers, rawRows:allRows.slice(0), headerless:true};
  }
  return {headers:first.map(h=>String(h)), rawRows:allRows.slice(1), headerless:false};
}

// Leitor inteligente do relatório "Planejamento de Escala" (reports_Escala-...).
// O arquivo pode trazer título/metadados antes da tabela. Para o sistema, só importam
// os campos necessários para reconhecer o diarista e registrar o lançamento.
function parsePlanejamentoEscalaRows(rows){
  if(!rows || !rows.length) return null;
  let headerIdx = -1;
  for(let i=0;i<Math.min(rows.length,20);i++){
    const norm = (rows[i]||[]).map(x=>normalizeName(String(x||'')).toLowerCase());
    const temNome = norm.some(x=>x==='nome');
    const temCpf = norm.some(x=>x==='cpf');
    const temData = norm.some(x=>x==='data');
    if(temNome && temCpf && temData){ headerIdx=i; break; }
  }
  if(headerIdx<0) return null;
  const originalHeaders=(rows[headerIdx]||[]).map(x=>String(x||'').trim());
  const normHeaders=originalHeaders.map(x=>normalizeName(x).toLowerCase());
  const idxNome=normHeaders.findIndex(x=>x==='nome');
  const idxCpf=normHeaders.findIndex(x=>x==='cpf');
  const idxEmail=normHeaders.findIndex(x=>x==='email' || x==='e-mail');
  const idxCel=normHeaders.findIndex(x=>x==='celular' || x==='telefone');
  const idxData=normHeaders.findIndex(x=>x==='data');
  if(idxNome<0 || idxCpf<0) return null;

  // Lê a empresa do cabeçalho/metadados do relatório, quando existir.
  // Ex.: "Site: CORDOVIL - SVC - KN" => empresa KN.
  let empresaMeta='';
  let dataChave=''; let horaChave='';
  for(let i=0;i<headerIdx;i++){
    for(const cell of (rows[i]||[])){
      const txt=String(cell||'').trim();
      // A chave KN também contém a DATA/HORA REAL do trabalho.
      // Ex.: CORDKN190920260500 => 19/09/2026 05:00.
      const km=txt.match(/Chave:\s*[A-Z]*KN(\d{2})(\d{2})(\d{4})(\d{2})(\d{2})/i);
      if(km){ dataChave=`${km[3]}-${km[2]}-${km[1]}`; horaChave=`${km[4]}:${km[5]}`; }
      const sm=txt.match(/^Site:\s*(.+)$/i);
      if(sm){
        const partes=sm[1].split('-').map(x=>x.trim()).filter(Boolean);
        empresaMeta=(partes[partes.length-1]||'').toUpperCase();
      }
      const em=txt.match(/^Empresa:\s*(.+)$/i);
      if(em) empresaMeta=em[1].trim().toUpperCase();
    }
  }

  const out=[];
  for(let i=headerIdx+1;i<rows.length;i++){
    const r=rows[i]||[];
    const nome=String(r[idxNome]||'').trim();
    const cpf=String(r[idxCpf]||'').trim();
    if(!nome && !cpf) continue;
    // Ignora rodapé/metadados e qualquer linha que não seja pessoa.
    if(/^gerado em/i.test(nome) || /^chave:/i.test(nome) || /^site:/i.test(nome)) continue;
    const dataOriginal = idxData>=0 ? String(r[idxData]||'').trim() : '';
    // NORMALIZA AQUI, diretamente da célula Data da MESMA LINHA DO DIARISTA.
    // Ex.: 19/09/2026 05:00 -> Data 2026-09-19 e Horário 05:00.
    // Nunca usa a linha "Gerado em" como data de trabalho.
    const dm = dataOriginal.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})(?:\s+(\d{1,2}):(\d{2}))?/);
    let dataTrabalho = ''; let horaTrabalho = '';
    if(dm){
      let yy=dm[3]; if(yy.length===2) yy='20'+yy;
      dataTrabalho = `${yy}-${dm[2].padStart(2,'0')}-${dm[1].padStart(2,'0')}`;
      if(dm[4]!=null) horaTrabalho = `${dm[4].padStart(2,'0')}:${dm[5]}`;
    }
    out.push([
      nome,
      cpf,
      idxEmail>=0?String(r[idxEmail]||'').trim():'',
      idxCel>=0?String(r[idxCel]||'').trim():'',
      // Prioridade: data/hora da chave do planejamento. Ela representa o dia da escala.
      // Se não houver chave, usa a Data da própria linha do diarista.
      dataChave || dataTrabalho || dataOriginal,
      horaChave || horaTrabalho
    ]);
  }
  if(!out.length) return null;
  return {headers:['Nome','CPF','Email','Celular','Data','Horário de entrada'], rawRows:out, smart:true, empresaMeta};
}
function splitDataHoraEscala(v){
  const s=String(v||'').trim();
  let data='', hora='';
  let m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})(?:\s+(\d{1,2}):(\d{2}))?/);
  if(m){
    let y=m[3]; if(y.length===2)y='20'+y;
    data=`${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
    if(m[4]!=null) hora=`${m[4].padStart(2,'0')}:${m[5]}`;
  } else if(/^\d{4}-\d{2}-\d{2}/.test(s)){
    data=s.slice(0,10); const hm=s.match(/(?:T|\s)(\d{1,2}):(\d{2})/); if(hm) hora=`${hm[1].padStart(2,'0')}:${hm[2]}`;
  }
  return {data,hora};
}
function turnoPorHorario(h){
  const hh=parseInt(String(h||'').split(':')[0],10);
  if(Number.isNaN(hh)) return '';
  if(hh>=4 && hh<12) return 'T1';
  if(hh>=12 && hh<21) return 'T2';
  return 'T3';
}
function renderImportar(c){

      <textarea id="pasteArea" class="w100" rows="6" placeholder="Cole aqui os dados, separados por TAB ou vírgula. Pode ser só uma lista de CPFs, um por linha, sem cabeçalho."></textarea>
      <div class="field mt8" style="display:flex;align-items:center;gap:8px;">
        <input type="checkbox" id="pasteHasHeader" style="width:auto;">
        <label class="mb0" for="pasteHasHeader" style="margin:0;">A lista colada tem uma linha de cabeçalho (ex: "Nome", "CPF"...) — desmarque se colou só os valores</label>
      </div>
      <div class="flex mt16" style="justify-content:flex-end;">
        <button class="btn" id="toStep2">Continuar &rarr;</button>
      </div>
    `;
    const dz = body.querySelector('#dz'), fileInput = body.querySelector('#fileInput');
    dz.onclick = ()=>fileInput.click();
    dz.ondragover = e=>{e.preventDefault(); dz.style.borderColor='var(--blue-light)';};
    dz.ondrop = e=>{e.preventDefault(); if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);};
    fileInput.onchange = e=>{ if(e.target.files[0]) handleFile(e.target.files[0]); };
    function handleFile(file){
      const reader = new FileReader();
      reader.onload = ev=>{
        try{
          const wb = XLSX.read(ev.target.result, {type:'binary'});
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:''});
          const cleaned = rows.filter(r=>r.some(cell=>String(cell).trim()!==''));
          const smart = parsePlanejamentoEscalaRows(cleaned);
          const split = smart || splitHeaderAndData(cleaned);
          wiz.headers = split.headers; wiz.rawRows = split.rawRows;
          wiz.smartPlanejamento = !!split.smart;
          if(split.smart && split.empresaMeta) wiz.empresaGeral = split.empresaMeta;
          if(split.headerless) toast('A primeira linha do arquivo parece ser um dado (ex: CPF), não um título — foi incluída como registro.','info');
          if(split.smart) toast('Relatório reconhecido: a DATA AO LADO DO NOME será usada como data de trabalho, junto com o horário. A convocação ser feita no dia anterior não muda essa data. Empresa/data/horário ausentes ficam para preenchimento manual.','ok');
          else toast('Arquivo carregado: '+file.name,'ok');
          finishStep1();
        }catch(err){ toast('Erro ao ler o arquivo: '+err.message,'err'); }
      };
      reader.readAsBinaryString(file);
    }
    body.querySelector('#toStep2').onclick = ()=>{
      const pasted = body.querySelector('#pasteArea').value.trim();
      const hasHeaderChecked = body.querySelector('#pasteHasHeader').checked;
      if(!wiz.rawRows && pasted){
        const allRows = parseCSVText(pasted);
        const split = splitHeaderAndData(allRows, hasHeaderChecked? undefined : true);
        wiz.headers = split.headers; wiz.rawRows = split.rawRows;
        if(hasHeaderChecked && split.headerless) toast('Detectamos que a lista colada não tem cabeçalho — a primeira linha foi tratada como um registro, não como título.','info');
      }
      if(!wiz.rawRows || !wiz.rawRows.length){ toast('Selecione um arquivo ou cole os dados antes de continuar.','err'); return; }
      finishStep1();
    };
    function finishStep1(){
      wiz.dataGeral = body.querySelector('#wDataGeral').value || '';
      wiz.turnoGeral = body.querySelector('#wTurnoGeral').value;
      wiz.empresaGeral = (body.querySelector('#wEmpresaGeral').value.trim() || wiz.empresaGeral || '').toUpperCase();
      wiz.mapping = {};
      wiz.headers.forEach((h,i)=>{ const f = guessField(h); if(f) wiz.mapping[i]=f; });

      wiz.step = 2; navigate();
    }

    body.innerHTML = `
      <div class="alert info">${wiz.smartPlanejamento?'Relatório KN reconhecido automaticamente. O sistema separou apenas os dados necessários para identificar os diaristas.':'Confirme como cada coluna do arquivo corresponde aos campos do sistema.'} ${wiz.rawRows.length} linha(s) detectada(s).</div>
      <div class="table-wrap"><table><thead><tr><th>Coluna do arquivo</th><th>Exemplo</th><th>Campo do sistema</th></tr></thead>
      <tbody>${wiz.headers.map((h,i)=>`<tr>
        <td><strong>${esc(h)}</strong></td>
        <td class="muted">${esc(wiz.rawRows[0]?wiz.rawRows[0][i]:'')}</td>
        <td><select data-col="${i}">${fieldOptions.map(f=>`<option value="${f}" ${wiz.mapping[i]===f?'selected':''}>${fieldLabels[f]}</option>`).join('')}</select></td>
      </tr>`).join('')}</tbody></table></div>
      <div class="flex between mt16">
        <button class="btn secondary" id="back1">&larr; Voltar</button>
        <button class="btn" id="toStep3">Processar dados &rarr;</button>
      </div>
    `;
    body.querySelectorAll('select[data-col]').forEach(sel=>{
      sel.onchange = ()=>{ wiz.mapping[sel.dataset.col] = sel.value; };
    });
    body.querySelector('#back1').onclick = ()=>{ wiz.step=1; navigate(); };
    body.querySelector('#toStep3').onclick = ()=>{
      if(!Object.values(wiz.mapping).includes('nome') && !Object.values(wiz.mapping).includes('cpf')){
        toast('Mapeie ao menos a coluna de Nome ou CPF.','err'); return;
      }
      processarLinhas();
      wiz.step=3; navigate();
    };
  }

  function processarLinhas(){
    const colByField = {};
    Object.entries(wiz.mapping).forEach(([col,field])=>{ if(field) colByField[field]=Number(col); });
    const seenInBatch = new Set(); // cpf+data+turno
    const rows = wiz.rawRows.map((r)=>{
      const get = f => colByField[f]!==undefined ? String(r[colByField[f]]||'').trim() : '';
      const nome = get('nome');
      const cpfRaw = get('cpf');
      const cpf = normalizeCPF(cpfRaw);
      const dataRaw = get('data');
      const dh = splitDataHoraEscala(dataRaw);
      let horario = get('horario_entrada') || dh.hora;
      let turno = (get('turno')||wiz.turnoGeral||'').toUpperCase().trim();
      if(!turno && horario) turno = turnoPorHorario(horario);
      const empresaArquivo = (get('empresa')||wiz.empresaGeral||'').toUpperCase().trim();
      const groot = get('groot_id');
      const cargoArquivo = get('cargo');
      // A data ao lado do nome é a data REAL em que o diarista vai trabalhar.
      // O fato de a convocação/lista ser feita no dia anterior não altera essa data.
      const data = dh.data || (dataRaw ? normalizeDateInput(dataRaw) : wiz.dataGeral);

      if(!nome && !cpf){
        return {status:'erro', motivo:'Sem nome e sem CPF', nome, cpf, turno, horario, empresa:empresaArquivo, groot, cargo:cargoArquivo||'Diarista', data};
      }
      if(cpfRaw && cpf.length!==11){
        return {status:'erro', motivo:`CPF com ${cpf.length} dígito(s) — deveria ter 11. Confira se o Excel não removeu zeros à esquerda (formate a coluna como Texto).`, nome, cpf, turno, horario, empresa:empresaArquivo, groot, cargo:cargoArquivo||'Diarista', data};
      }
      let match = cpf ? findDiaristaByCPF(cpf) : null;
      if(!match && nome) match = findDiaristaByName(nome);

      const key = (cpf||normalizeName(nome))+'|'+data+'|'+turno;
      let status = match ? 'encontrado' : 'novo';
      let dupInfo = '';
      if(seenInBatch.has(key)){ status='duplicidade'; dupInfo='Já presente nesta listagem (mesmo CPF/nome, data e turno).'; }
      else {
        const existsHist = HISTORICO.find(h=> (cpf? normalizeCPF(h.cpf)===cpf : normalizeName(h.nome)===normalizeName(nome)) && h.data===data && h.turno===turno);
        if(existsHist){ status='duplicidade'; dupInfo='Já existe um lançamento igual no histórico (CPF/nome + data + turno).'; }
      }
      seenInBatch.add(key);

      return {
        status, dupInfo, include: status!=='erro',
        // Se já existe no Banco, os dados cadastrais do Banco prevalecem. O arquivo serve para reconhecer a pessoa e o dia/horário.
        nome: match?match.nome:nome,
        cpf: match?match.cpf:cpf,
        turno, horario,
        empresa: 'TSI',
        groot: match?(match.groot_id||''):groot,
        cargo: match?(match.cargo||'Diarista'):(cargoArquivo||'Diarista'),
        data,
        diarista_id: match?match.id:null,
      };
    });
    wiz.processed = rows;
  }
  function normalizeDateInput(v){
    v = v.trim();
    if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
    const m = v.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
    if(m){ let [_,d,mo,y]=m; if(y.length===2) y='20'+y; return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`; }
    return wiz.dataGeral || '';
  }

  function step3(){

    rows.forEach(r=>counts[r.status]++);

        <span class="pill novo">Novos: ${counts.novo}</span>

          <div class="field mb0"><label>Aplicar Empresa a todas as linhas</label><input id="bulkEmpresa" list="empresasList3" value="TSI" placeholder="TSI"><datalist id="empresasList3">${empresasUsadas().map(e=>`<option value="${e}">`).join('')}</datalist></div>

      <tbody>${rows.map((r,i)=>`<tr>
        <td><input type="checkbox" data-inc="${i}" ${r.include?'checked':''} ${r.status==='erro'?'disabled':''}></td>
        <td>${esc(r.nome)||'<span class="muted">—</span>'}</td>
        <td>${r.cpf?formatCPF(r.cpf):'<span class="muted">—</span>'}</td>
        <td><span class="pill ${r.status}">${r.status.toUpperCase()}</span>${r.dupInfo?`<div class="small muted">${esc(r.dupInfo)}</div>`:''}${r.status==='erro'?`<div class="small muted">${esc(r.motivo)}</div>`:''}</td>
        <td>${esc(r.groot)||'-'}</td>
        <td><input data-empresa="${i}" list="empresasList3" style="width:90px;" value="${esc(r.empresa)}" placeholder="definir"></td>
        <td><select data-turno="${i}" style="width:70px;"><option value="">—</option>${['T1','T2','T3'].map(t=>`<option ${r.turno===t?'selected':''}>${t}</option>`).join('')}</select></td>
        <td style="white-space:nowrap;">
          <input data-horario="${i}" style="width:65px;" value="${esc(r.horario)}" placeholder="08:00">
          <span class="link small" data-fromhere="${i}" title="Aplicar este horário desta linha para baixo" style="margin-left:4px;">&#8595;</span>
        </td>
        <td><input type="date" data-data="${i}" style="width:150px;" value="${esc(r.data)}"></td>
      </tr>`).join('')}</tbody></table></div>
      <div class="flex between mt16">
        <button class="btn secondary" id="back2">&larr; Voltar</button>
        <button class="btn" id="toStep4">Confirmar e salvar importação</button>
      </div>
    `;
    body.querySelectorAll('[data-inc]').forEach(cb=>cb.onchange=()=>{ rows[Number(cb.dataset.inc)].include = cb.checked; step3(); });
    body.querySelectorAll('[data-empresa]').forEach(inp=>inp.onchange=()=>{ rows[Number(inp.dataset.empresa)].empresa = inp.value.trim().toUpperCase(); step3(); });
    body.querySelectorAll('[data-turno]').forEach(sel=>sel.onchange=()=>{ rows[Number(sel.dataset.turno)].turno = sel.value; step3(); });

    body.querySelectorAll('[data-data]').forEach(inp=>inp.onchange=()=>{ rows[Number(inp.dataset.data)].data = inp.value; });
    body.querySelectorAll('[data-fromhere]').forEach(el=>{
      el.onclick = ()=>{
        const i = Number(el.dataset.fromhere);
        const inputAtual = body.querySelector(`[data-horario="${i}"]`);
        const valor = (inputAtual ? inputAtual.value : rows[i].horario || '').trim();
        if(!valor){ toast('Digite um horário nesta linha antes de aplicar para baixo.','warn'); return; }
        for(let k=i; k<rows.length; k++){ rows[k].horario = valor; }

    });
    body.querySelector('#bulkApply').onclick = ()=>{

    body.querySelector('#toStep4').onclick = async (ev)=>{
      const toSave = rows.filter(r=>r.include && r.status!=='erro');
      const incompletas = toSave.filter(r=>!r.empresa || !r.turno || !r.data);
      if(incompletas.length){ toast(incompletas.length+' linha(s) sem Empresa, Turno ou Data de trabalho — preencha antes de salvar.','err'); return; }
      ev.target.disabled = true; ev.target.textContent = 'Salvando...';
      let novos=0, salvos=0;
      const falhas = [];
      const novosNaSessao = {}; // chave cpf-ou-nome -> diarista_id recém-criado nesta importação
      for(const r of toSave){
        let diaristaId = r.diarista_id;
        const chave = r.cpf || normalizeName(r.nome);
        if(!diaristaId && novosNaSessao[chave]) diaristaId = novosNaSessao[chave];
        if(!diaristaId){
          const now = new Date().toISOString();
          const inserted = await sbInsert('diaristas', {nome:r.nome, cpf:r.cpf, empresa:'TSI', groot_id:r.groot, cargo:r.cargo, status:'Ativo', nome_normalizado:normalizeName(r.nome), created_at:now, updated_at:now});
          if(!inserted){
            // pode já existir com esse CPF (conflito de unicidade) — tenta localizar antes de desistir da linha
            let existente = findDiaristaByCPF(r.cpf);
            if(!existente){
              // cache local (DIARISTAS) pode estar desatualizada — confirma direto no banco antes de desistir
              existente = await sbFindDiaristaByCPF(r.cpf);
              if(existente) DIARISTAS.push(existente); // atualiza cache local pro resto desta importação
            }
            if(existente){ diaristaId = existente.id; }
            else { falhas.push(`${r.nome||r.cpf} — CPF já cadastrado, mas não foi possível localizar o registro`); continue; }
          } else {
            DIARISTAS.push(inserted); diaristaId = inserted.id; novosNaSessao[chave] = diaristaId; novos++;
          }
        }
        // Pega o Ext (LDAP) do cadastro nesse momento e grava junto do lançamento, pra ficar
        // salvo permanentemente (não recalculado depois, caso o cadastro mude no futuro).
        const diaristaCad = DIARISTAS.find(x=>x.id===diaristaId);
        const ldap = (diaristaCad && diaristaCad.ext) || '';
        const histRow = await sbInsert('historico_diarias', {diarista_id:diaristaId, data:r.data, dia_semana:diaSemana(r.data), turno:r.turno, horario_entrada:r.horario, cpf:r.cpf, nome:r.nome, groot_id:r.groot, empresa:'TSI', cargo:r.cargo, ldap, created_at:new Date().toISOString()});
        if(!histRow){ falhas.push(`${r.nome||r.cpf} (${fmtDateBR(r.data)}, ${r.turno}) — falha ao gravar o lançamento`); continue; }
        HISTORICO.push(histRow);
        salvos++;
      }
      await sbInsert('importacoes', {nome_arquivo:'Importação manual', data_importacao:new Date().toISOString(), quantidade_registros:salvos, usuario:'operador', status:'concluída'});
      const naoIncluidos = rows.length - toSave.length;
      let msg = `${salvos} de ${rows.length} linha(s) da lista foram salvas no histórico, sendo ${novos} novo(s) diarista(s) cadastrado(s).`;
      if(naoIncluidos>0) msg += ` ${naoIncluidos} linha(s) não foram incluídas por estarem como Duplicidade/Erro ou desmarcadas na conferência.`;
      if(falhas.length) msg += ` ⚠️ ${falhas.length} linha(s) falharam ao gravar no banco: ${falhas.join('; ')}.`;
      wiz.resultMsg = msg;
      wiz.resultOk = falhas.length===0;
      wiz.step=4; navigate();
    };
  }

  function step4(){
    body.innerHTML = `
      <div class="alert ${wiz.resultOk===false?'warn':'ok'}">${wiz.resultOk===false?'🟡 Importação concluída com atenção:':'🟢 Importação concluída com sucesso!'}<br>${esc(wiz.resultMsg||'')}</div>
      <button class="btn" id="novaImportacao">Nova importação</button>
      <button class="btn secondary" id="verDash" style="margin-left:8px;">Ver Dashboard</button>
    `;
    body.querySelector('#novaImportacao').onclick = ()=>{ renderImportar._wiz=null; navigate(); };
    body.querySelector('#verDash').onclick = ()=>{ renderImportar._wiz=null; currentView='dashboard'; navigate(); };
  }
}

// Ao editar o campo ABS de um dia, salva na mesma tabela distribuicao_diaria (junto com
// MELI/KN), sem mexer nos outros campos. Só soma o número digitado — sem precisar registrar
// diarista por diarista.
function attachAbsInputHandler(container){
  container.addEventListener('change', async (e)=>{
    const inp = e.target.closest('.abs-input');
    if(!inp) return;
    const dataISO = inp.dataset.data;
    let val = parseInt(inp.value);
    if(isNaN(val) || val<0) val = 0;
    inp.value = val;
    const existente = distDia(dataISO);
    const patch = {abs: val, updated_at:new Date().toISOString()};
    let ok;
    if(existente){
      const upd = await sbUpdate('distribuicao_diaria', existente.id, patch);
      ok = !!upd;
      if(ok) Object.assign(existente, patch);
    } else {
      const inserted = await sbInsert('distribuicao_diaria', {data:dataISO, meli:0, kn:0, ...patch});
      ok = !!inserted;
      if(ok) DIST_DIARIA.push(inserted);
    }
    if(ok) toast('ABS de '+fmtDateBR(dataISO)+' salva.','ok');
  });
}

// Exportação profissional (Excel com formatação) do Controle Diário do período — usada pela
// gerência para fechamento de fatura. Usa ExcelJS (carregado via CDN) para aplicar cores,
// negrito e bordas, o que a biblioteca xlsx básica usada no resto do sistema não suporta.
async function exportControleExcel(ini, fim){
  const datas = Array.from(new Set(HISTORICO.filter(h=>h.data>=ini && h.data<=fim).map(h=>h.data))).sort();
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('Faltas ABS');
  ws.columns = [{width:18},{width:34},{width:22},{width:16},{width:22},{width:14},{width:16},{width:12}];
  ws.mergeCells('A1:H1');
  ws.getCell('A1').value = 'KUEHNE+NAGEL — Relatório Fatura';
  ws.getCell('A1').font = {size:14,bold:true,color:{argb:'FFFFFFFF'}};
  ws.getCell('A1').fill = {type:'pattern',pattern:'solid',fgColor:{argb:'FF003B5C'}};
  ws.getCell('A1').alignment = {vertical:'middle',horizontal:'left'};
  ws.getRow(1).height=26;
  ws.mergeCells('A2:H2');
  ws.getCell('A2').value = `Período: ${fmtDateBR(ini)} a ${fmtDateBR(fim)} · Gerado em ${fmtDateBR(todayISO())}`;
  ws.getCell('A2').font={size:10,italic:true,color:{argb:'FF44586A'}};
  ws.getRow(3).height=6;
  const header=ws.getRow(4);
  header.values=['Groot ID','Nome','Empresa','Cargo','Escala','Data','Qtd. Diarista','Qtd. ABS'];
  header.eachCell(cell=>{cell.font={bold:true,color:{argb:'FFFFFFFF'}};cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF00A3E0'}};cell.alignment={vertical:'middle',horizontal:'center'};});
  let r=5;
  datas.forEach(d=>{
    const regs=registrosDoDia(d), totalDia=regs.length, dd=distDia(d), abs=dd?(dd.abs||0):0;
    regs.forEach((h,idx)=>{
      const cad=(h.diarista_id&&DIARISTAS.find(x=>x.id===h.diarista_id))||findDiaristaByCPF(h.cpf)||{};
      const row=ws.getRow(r++);
      row.values=[h.groot_id||cad.groot_id||'',h.nome||cad.nome||'',h.empresa||cad.empresa||'','Diarista',h.escala||cad.escala||h.turno||'',fmtDateBR(d),totalDia,idx===0?abs:''];
      row.eachCell((cell,col)=>{cell.alignment={vertical:'middle',horizontal:[1,6,7,8].includes(col)?'center':'left'};cell.border={bottom:{style:'thin',color:{argb:'FFD9E2E8'}}};});
    });
  });
  if(!datas.length){ws.mergeCells(`A${r}:H${r}`);ws.getCell(`A${r}`).value='Nenhum dado no período selecionado.';}
  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url;a.download=`faltas_abs_${ini}_a_${fim}.xlsx`;a.click();URL.revokeObjectURL(url);
  toast('Excel exportado com sucesso.','ok');
}

// Monta, pro modelo do outro sistema, a lista de pessoas únicas lançadas num período — Nome,
// MATRIZ (fixo), SVC (fixo), ID GROOT e LDAP. LDAP vem do que foi gravado junto do lançamento
// (h.ldap), que é o valor de Ext que o cadastro tinha naquele dia; só cai pro cadastro atual em
// lançamentos antigos, de antes desse campo existir.
function pessoasNoPeriodo(iniISO, fimISO){
  const registros = HISTORICO.filter(h=>h.data>=iniISO && h.data<=fimISO);
  const vistos = new Set();
  const pessoas = [];
  registros.forEach(h=>{
    const d = (h.diarista_id && DIARISTAS.find(x=>x.id===h.diarista_id)) || findDiaristaByCPF(h.cpf);
    const chave = (h.cpf || (d && d.cpf) || normalizeName(h.nome));
    if(vistos.has(chave)) return;
    vistos.add(chave);
    pessoas.push({
      nome: h.nome || (d && d.nome) || '',
      matriz: 'CORDOVIL',
      svc: 'SRJ1',
      groot_id: h.groot_id || (d && d.groot_id) || '',
      ldap: h.ldap || (d && d.ext) || ''
    });
  });
  return pessoas.sort((a,b)=>a.nome.localeCompare(b.nome));
}

// Exporta, no modelo de importação do outro sistema (colunas: Nome Completo *, MATRIZ *, SVC,
// ID GROOT, LDAP), as pessoas que trabalharam num período — uma linha por pessoa, sem repetir
// mesmo que tenha mais de um lançamento no período. MATRIZ e SVC são fixos (CORDOVIL / SRJ1).
function exportModeloOutroSistema(iniISO, fimISO){
  const pessoas = pessoasNoPeriodo(iniISO, fimISO);
  if(!pessoas.length){ toast('Nenhum lançamento encontrado nesse período.','err'); return; }
  const linhas = pessoas.map(p=>({
    'Nome Completo *': p.nome,
    'MATRIZ *': p.matriz,
    'SVC': p.svc,
    'ID GROOT': p.groot_id,
    'LDAP': p.ldap
  }));
  const wb = XLSX.utils.book_new();
  const wsDiaristas = XLSX.utils.json_to_sheet(linhas, {header:['Nome Completo *','MATRIZ *','SVC','ID GROOT','LDAP']});
  XLSX.utils.book_append_sheet(wb, wsDiaristas, 'Diaristas');
  const wsListas = XLSX.utils.aoa_to_sheet([['Matriz','SVC'], ['CORDOVIL','SRJ1']]);
  XLSX.utils.book_append_sheet(wb, wsListas, 'Listas');
  const sufixo = iniISO===fimISO ? iniISO : `${iniISO}_a_${fimISO}`;
  XLSX.writeFile(wb, `importacao_diaristas_${sufixo}.xlsx`);
  toast(`Exportação gerada com ${linhas.length} pessoa(s): importacao_diaristas_${sufixo}.xlsx`, 'ok');
}

async function limparDistribuicaoOrfa(datas){
  for(const d of datas){
    if(registrosDoDia(d).length>0) continue;
    const dd = distDia(d);
    if(!dd || dd.plantao_responsavel) continue;
    const ok = await sbDelete('distribuicao_diaria', dd.id);
    if(ok) DIST_DIARIA = DIST_DIARIA.filter(x=>x.id!==dd.id);
  }
}

/* ===================== HISTÓRICO ===================== */
function renderHistorico(c){
  const state = renderHistorico._state || {q:'', ini:'', fim:'', cpf:'', nome:'', groot:'', empresa:'', turno:'', cargo:'', dia:''};
  renderHistorico._state = state;
  // Mantém as marcações mesmo quando a tela é redesenhada/atualizada automaticamente.
  const selecionados = renderHistorico._selecionados || new Set();
  renderHistorico._selecionados = selecionados;
  const panel = document.createElement('div');
  panel.className='panel';
  panel.innerHTML = `
    <div class="hist-filtros">
      <div class="field mb0 hf-busca"><label>Pesquisar</label><input id="fQ" type="search" placeholder="Nome, GROOT, empresa, observação, horário…" value="${esc(state.q||'')}"></div>
      <div class="field mb0"><label>De</label><input type="date" id="fIni" value="${state.ini}"></div>
      <div class="field mb0"><label>Até</label><input type="date" id="fFim" value="${state.fim}"></div>
      <div class="field mb0"><label>Empresa</label><select id="fEmpresa"><option value="">Todas</option>${empresasUsadas().map(e=>`<option ${state.empresa===e?'selected':''}>${e}</option>`).join('')}</select></div>
      <div class="field mb0"><label>Turno</label><select id="fTurno"><option value="">Todos</option>${['T1','T2','T3'].map(t=>`<option ${state.turno===t?'selected':''}>${t}</option>`).join('')}</select></div>
      <div class="field mb0"><label>Dia</label><select id="fDia"><option value="">Todos</option>${DIAS_SEMANA.map(d=>`<option value="${d}" ${state.dia===d?'selected':''}>${d.split('-')[0]}</option>`).join('')}</select></div>
      <div class="hf-botoes">
        <button class="btn secondary sm" id="clearFilters">Limpar</button>
        <button class="btn secondary sm" id="expHist">⬇ CSV</button>
        <button class="btn secondary sm" id="delSelected" style="color:var(--red);border-color:var(--red);" disabled>Excluir selecionados (0)</button>
        <button class="btn sm" id="applyFilters" hidden>Aplicar</button>
      </div>
    </div>
    <div class="table-wrap mt16" id="hTable"></div>
  `;
  c.appendChild(panel);
  function getFiltered(){
    return HISTORICO.filter(h=>{
      if(state.ini && h.data<state.ini) return false;
      if(state.fim && h.data>state.fim) return false;
      if(state.cpf && !onlyDigits(h.cpf).includes(onlyDigits(state.cpf))) return false;
      if(state.nome && !normalizeName(h.nome).includes(normalizeName(state.nome))) return false;
      if(state.groot && !(h.groot_id||'').includes(state.groot)) return false;
      if(state.empresa && h.empresa!==state.empresa) return false;
      if(state.turno && h.turno!==state.turno) return false;
      if(state.dia && diaSemana(h.data)!==state.dia) return false;
      const q = (state.q||'').trim();
      if(q){
        const texto = normalizeName([h.nome, h.groot_id, h.empresa, h.cargo, h.turno, h.horario_entrada, fmtDateBR(h.data), h.data, diaSemana(h.data), h.observacao, h.ldap,
          fmtBatida(h.qr_entrada_batida_em,h.data), fmtBatida(h.qr_saida_batida_em,h.data), plantaoDe(h.data), isAdmin()?h.cpf:'', isAdmin()?formatCPF(h.cpf):''].filter(Boolean).join(' | '));
        const partes = normalizeName(q).split(' ').filter(Boolean);
        if(!partes.every(p=>texto.includes(p))) return false;
      }
      return true;
    }).sort((a,b)=>b.data.localeCompare(a.data));
  }
  function updateDelBtn(){
    const btn = panel.querySelector('#delSelected');
    btn.textContent = `Excluir selecionados (${selecionados.size})`;
    btn.disabled = selecionados.size===0;
  }
  function draw(){
    const temFiltro = !!((state.q||'').trim()||state.ini||state.fim||state.empresa||state.turno||state.dia);
    if(!temFiltro){
      document.getElementById('hTable').innerHTML = '';
      return;
    }
    const list = getFiltered();
    const visiveis = list.slice(0,500);

  { let _t=null; panel.querySelector('#fQ').addEventListener('input', ()=>{ clearTimeout(_t); _t=setTimeout(()=>syncFilters(true),250); }); }
  panel.querySelector('#applyFilters').onclick = ()=>syncFilters(true);

      list.map(h=>[fmtDateBR(h.data), diaSemana(h.data), h.nome, formatCPF(h.cpf), h.groot_id||'', h.empresa, h.cargo, h.turno, h.horario_entrada, fmtBatida(h.qr_entrada_batida_em,h.data), fmtBatida(h.qr_saida_batida_em,h.data)]));
  };
  panel.querySelector('#delSelected').onclick = async ()=>{
    if(selecionados.size===0) return;
    if(!confirm(`Excluir ${selecionados.size} lançamento(s) selecionado(s) do histórico? Esta ação não pode ser desfeita.`)) return;
    const ids = Array.from(selecionados);
    const datasAfetadas = new Set();
    let ok=0;
    for(const id of ids){
      const registro = HISTORICO.find(h=>h.id===id);
      const r = await sbDelete('historico_diarias', id);
      if(r){ ok++; HISTORICO = HISTORICO.filter(h=>h.id!==id); if(registro) datasAfetadas.add(registro.data); }
    }
    selecionados.clear();
    await limparDistribuicaoOrfa(Array.from(datasAfetadas));
    toast(ok+' lançamento(s) excluído(s).','ok');
    draw();
    updateDelBtn();
  };
}

// ===================== EXPORTAR LANÇAMENTOS (modelo_importacao_lancamentos) =====================
// Uma linha por lançamento (diarista + dia) no período filtrado — ao contrário do export de
// Diaristas acima, aqui NÃO deduplica por pessoa, pois o modelo é de lançamentos diários.
// Data, Empresa, Turno, Nome, ID GROOT e MATRIZ/SVC vêm do histórico; Motivo, Solicitado Por,
// Autorizado Por e Grupo são preenchidos uma vez na tela e aplicados a todas as linhas do período.
function lancamentosNoPeriodo(iniISO, fimISO){
  return HISTORICO.filter(h=>h.data>=iniISO && h.data<=fimISO)
    .slice()
    .sort((a,b)=> a.data===b.data ? (a.nome||'').localeCompare(b.nome||'') : a.data.localeCompare(b.data))
    .map(h=>({
      data: h.data,
      empresa: h.empresa || '',
      turno: h.turno || '',
      nome: h.nome || '',
      groot_id: h.groot_id || '',
      matriz: 'CORDOVIL',
      svc: 'SRJ1'
    }));
}

// Gera o .xlsx exatamente no formato de modelo_importacao_lancamentos.xlsx: aba "Lancamentos"
// (uma linha por diarista/dia no período) + aba "Listas" com as opções de Motivo/Turno/Parte/Matriz/SVC,
// copiada do próprio modelo enviado.
function exportLancamentosXlsx(iniISO, fimISO, extras){
  const linhas = lancamentosNoPeriodo(iniISO, fimISO);
  if(!linhas.length){ toast('Nenhum lançamento encontrado nesse período.','err'); return; }
  if(!extras.motivo){ toast('Selecione o Motivo antes de exportar.','err'); return; }

  const header = ['Data *','Empresa *','Motivo *','Turno *','Solicitado Por','Autorizado Por','MATRIZ *','SVC','Nome Diarista *','ID GROOT','Grupo'];
  const dados = linhas.map(l=>({
    'Data *': fmtDateBR(l.data),
    'Empresa *': l.empresa,
    'Motivo *': extras.motivo,
    'Turno *': l.turno,
    'Solicitado Por': extras.solicitado,
    'Autorizado Por': extras.autorizado,
    'MATRIZ *': l.matriz,
    'SVC': l.svc,
    'Nome Diarista *': l.nome,
    'ID GROOT': l.groot_id,
    'Grupo': extras.grupo
  }));

  const wb = XLSX.utils.book_new();
  const wsLanc = XLSX.utils.json_to_sheet(dados, {header});
  XLSX.utils.book_append_sheet(wb, wsLanc, 'Lancamentos');

  const wsListas = XLSX.utils.aoa_to_sheet([
    ['Motivo','Turno','Parte','Matriz','SVC'],
    ['ADEQUAÇÃO DE QUADRO','T1','KUEHNE + NAGEL','CORDOVIL','SRJ1'],
    ['ABSENTEÍSMO','T2','MERCADO LIVRE','',''],
    ['VOLUME ACIMA DO PREVISTO','T3','','',''],
    ['PULMÃO KN','','','',''],
  ]);
  XLSX.utils.book_append_sheet(wb, wsListas, 'Listas');

  const sufixo = iniISO===fimISO ? iniISO : `${iniISO}_a_${fimISO}`;
  XLSX.writeFile(wb, `lancamentos_${sufixo}.xlsx`);
  toast(`Exportação gerada com ${linhas.length} lançamento(s): lancamentos_${sufixo}.xlsx`, 'ok');
}

// Converte "AAAA-MM" no primeiro e último dia daquele mês (formato ISO), pra filtrar HISTORICO.
function mesParaIntervalo(m){
  const [ano, mes] = m.split('-').map(Number);
  const ultimoDia = new Date(ano, mes, 0).getDate();
  return [`${m}-01`, `${m}-${String(ultimoDia).padStart(2,'0')}`];
}

function exportCSV(filename, header, rows){
  const esc2 = v => `"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const csv = [header.map(esc2).join(';'), ...rows.map(r=>r.map(esc2).join(';'))].join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
  toast('Exportação gerada: '+filename,'ok');
}

/* ===================== REGISTROS DOS DIAS =====================
   Cada dia com diaristas fica registrado aqui com as batidas de entrada e saída
   (o Dashboard mostra só o dia de hoje). Sábado e domingo são plantão: guarda o
   nome do assistente responsável pelo plantão (campo plantao_responsavel). */
function ehFimDeSemana(dataISO){ const [y,m,d]=dataISO.split('-').map(Number); const w=new Date(y,m-1,d).getDay(); return w===0||w===6; }

async function salvarPlantao(dataISO, nome){
  const existente = distDia(dataISO);
  const patch = {plantao_responsavel: nome || null, updated_at: new Date().toISOString()};
  if(existente){
    const upd = await sbUpdate('distribuicao_diaria', existente.id, patch);
    if(!upd) return false;
    Object.assign(existente, patch); return true;
  }
  const ins = await sbInsert('distribuicao_diaria', {data:dataISO, meli:0, kn:0, ...patch});

].map(([key,label,hora,grupo])=>({key,label,hora,grupo}));
const ESCALA_ANTIGA_PARA_CHAVE = {'59':'G2-08h','1333':'G1-08h','2033':'G1-23h','2034':'G2-23h','2035':'G3-23h','2036':'G4-23h','2045':'G1-13h','2046':'G2-13h','2047':'G3-13h','2048':'G4-13h','2311':'A1-14h','2312':'A2-14h','2313':'A3-14h','2314':'A4-14h','2424':'C1-06h','2425':'C2-06h','2426':'C3-06h','2427':'C4-06h','2432':'B3-05h','2450':'B4-05h','2451':'B1-05h','2452':'B2-05h','2453':'C2-05h','2454':'C1-05h','2455':'C4-05h','2456':'C3-05h'};
function chaveDaEscala(raw){
  const t = String(raw==null?'':raw).trim(); if(!t) return null;
  if(/^\d+$/.test(t)) return ESCALA_ANTIGA_PARA_CHAVE[t] || null;
  const m = t.toUpperCase().match(/([A-Z])\s*(\d)\s*-?\s*(\d{2})\s*H/);
  return m ? `${m[1]}${m[2]}-${m[3]}h` : null;
}
const PAINEL_KN = {url:'https://cjentqthseecgizptyqe.supabase.co', key:'sb_publishable_ca35t-HrAIN5fpJk45P8FQ_10xWlHIV'};
const HEADCOUNT_SCRIPT = {url:'https://script.google.com/macros/s/AKfycbxH6CD_BsLIHcel7mn_LLz5H2eoiGCb-tigI6LOfnH7SspMw9AM5B2dDqtwK3KqbJ3-nA/exec', chave:'kn2026cobertura'};
const FOLGAS = {carregado:false, carregando:null, cal:{}, lideranca:[], pessoas:[], gruposUrl:'', gruposErro:'', gruposAtualizado:'', dia:{}, diaCarregando:{}};
async function chamarHeadcount(iso){
  const u = HEADCOUNT_SCRIPT.url+'?data='+iso+'&chave='+encodeURIComponent(HEADCOUNT_SCRIPT.chave);
  try{ const r = await fetch(u); return await r.json(); }
  catch(e){ return await new Promise((ok,no)=>{ const cb='knf'+Date.now().toString(36); const sc=document.createElement('script'); const tm=setTimeout(()=>{ no(new Error('tempo esgotado')); sc.remove(); },45000);
    window[cb]=d=>{ clearTimeout(tm); ok(d); try{ delete window[cb]; }catch(_){} sc.remove(); }; sc.onerror=()=>{ clearTimeout(tm); no(new Error('sem acesso à planilha')); sc.remove(); }; sc.src=u+'&callback='+cb; document.head.appendChild(sc); }); }
}
/* folgas do dia direto da Headcount (aba de folgas da planilha); se não responder, usa o calendário salvo */
async function folgasDoDiaHeadcount(iso){
  if(FOLGAS.dia[iso]) return FOLGAS.dia[iso];
  if(FOLGAS.diaCarregando[iso]) return FOLGAS.diaCarregando[iso];
  FOLGAS.diaCarregando[iso] = (async ()=>{
    try{
      const r = await chamarHeadcount(iso);
      if(!r || r.ok===false || (!r.folgas && !r.semana)) throw new Error((r&&(r.erro||r.error))||'resposta vazia');
      const set = new Set();
      (r.folgas||[]).forEach(t=>{ const k=chaveDaEscala(t); if(k) set.add(k); });
      Object.entries(r.semana||{}).forEach(([t,v])=>{ if(Number(v)===0){ const k=chaveDaEscala(t); if(k) set.add(k); } });
      FOLGAS.dia[iso] = {ok:true, set};
    }catch(e){ console.warn('Headcount folgas', e); FOLGAS.dia[iso] = {ok:false}; }
    delete FOLGAS.diaCarregando[iso];
    return FOLGAS.dia[iso];
  })();
  return FOLGAS.diaCarregando[iso];
}
async function carregarFolgas(forcar){
  if(FOLGAS.carregado && !forcar) return;
  if(FOLGAS.carregando) return FOLGAS.carregando;
  FOLGAS.carregando = (async ()=>{
    try{
      const {data, error} = await sb.from('folga_config').select('calendars,leadership_text,grupos_url,updated_at').eq('id','default').maybeSingle();
      if(error) throw error;
      FOLGAS.cal = {}; Object.entries((data&&data.calendars)||{}).forEach(([k,v])=>FOLGAS.cal[k]=new Set(v||[]));
      FOLGAS.lideranca = String((data&&data.leadership_text)||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{ const p=l.split('|').map(x=>x.trim()); return {nome:p[0]||'', grupo:(p[1]||'').toUpperCase(), papel:p[2]||''}; });
      FOLGAS.gruposUrl = (data&&data.grupos_url)||'';
    }catch(e){ console.error('folga_config', e); toast('Não consegui carregar as folgas: '+(e.message||e),'err'); }
    FOLGAS.pessoas = []; FOLGAS.gruposErro = '';
    try{
      const r = await fetch(PAINEL_KN.url+'/rest/v1/svc_shared_state?select=state_key,payload&state_key=like.esc:*', {headers:{apikey:PAINEL_KN.key, Authorization:'Bearer '+PAINEL_KN.key}});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const linhas = await r.json(); const vistos = new Set();
      linhas.forEach(l=>{ const g=l.payload||{}; if(g.tipo==='cargo') return; const chave = chaveDaEscala(g.turno) || chaveDaEscala(g.code);
        (g.pessoas||[]).forEach(p=>{ const nome=String(p.nome||'').trim(); if(!nome) return; const id=(String(p.cpf||'').replace(/\D/g,''))||normalizeName(nome); if(vistos.has(id)) return; vistos.add(id);
          FOLGAS.pessoas.push({nome, escala:g.turno||'', antiga:g.code||'', chave}); }); });
      if(!FOLGAS.pessoas.length) FOLGAS.gruposErro = 'A lista de pessoas das escalas veio vazia.';
    }catch(e){ console.error('Painel KN escalas', e); FOLGAS.gruposErro = 'Não consegui ler a lista de pessoas das escalas agora.'; }
    if(!FOLGAS.pessoas.length && FOLGAS.gruposUrl){
      try{
        const r = await fetch(FOLGAS.gruposUrl); const j = await r.json();
        if(!j.ok) throw new Error(j.erro||'resposta inválida');
        FOLGAS.pessoas = (j.pessoas||[]).filter(p=>!/inativ|deslig/i.test(p.status||'')).map(p=>({nome:p.nome, escala:p.escala, antiga:p.antiga, chave: chaveDaEscala(p.escala) || chaveDaEscala(p.antiga)}));
        FOLGAS.gruposAtualizado = j.atualizado||'';
      }catch(e){ console.error('GRUPOS', e); FOLGAS.gruposErro = 'Não consegui ler a aba GRUPOS da Headcount agora.'; }
    }
    FOLGAS.carregado = true; FOLGAS.carregando = null;
  })();
  return FOLGAS.carregando;
}
function pessoasDaEscala(cal){
  if(cal.grupo) return FOLGAS.lideranca.filter(p=>p.grupo===cal.grupo).map(p=>({nome:p.nome, sub:p.papel}));
  return FOLGAS.pessoas.filter(p=>p.chave===cal.key).map(p=>({nome:p.nome, sub:p.escala||p.antiga||''})).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
}
const ehFolga = (cal, iso)=>{
  const d = FOLGAS.dia[iso];
  if(d && d.ok && !cal.grupo) return d.set.has(cal.key);
  return !!(FOLGAS.cal[cal.key] && FOLGAS.cal[cal.key].has(iso));
};
