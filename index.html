  panel.innerHTML = `
    <h2>Sobre o sistema</h2>
    <p class="small muted">KN Diaristas Control — controle e gestão de diaristas da operação, com identificação automática por CPF/nome, histórico permanente e indicadores MELI × KN.</p>
    <h3>Empresas cadastradas</h3>
    <div>${empresasUsadas().map(e=>`<span class="chip">${e}</span>`).join('')}</div>
    <h3>Dados armazenados</h3>
    <p class="small muted">${DIARISTAS.length} diaristas cadastrados, ${HISTORICO.length} lançamentos no histórico, ${IMPORTS.length} importações realizadas. Os dados ficam salvos em um banco de dados compartilhado (Supabase) — qualquer pessoa que abrir este arquivo vê e edita as mesmas informações em tempo real.</p>
    <div class="alert info mt16">🔗 Este arquivo se conecta ao projeto Supabase <strong>kuehne-diaristas</strong>. Para funcionar, ele precisa ser aberto por um navegador com acesso à internet.</div>
    <div class="alert warn mt16">⚠️ Ainda não há login de usuários nem perfis de acesso (Administrador/Operador) — qualquer pessoa com o link do arquivo pode ler e editar os dados. Recomendado como próximo passo antes de uso mais amplo na operação.</div>
  `;
  c.appendChild(panel);

  const panelZerar = document.createElement('div');
  panelZerar.className='panel';
  panelZerar.innerHTML = `
    <h2>Zerar batidas de ponto (QR)</h2>
    <p class="small muted">Use apenas para <strong>testar o app QR Diaristas</strong> ou em caso de emergência. Isso apaga os horários de Entrada e Saída batidos pelo QR de um dia — os diaristas continuam lançados no histórico normalmente, só as batidas de ponto são zeradas. Essa ação não pode ser desfeita.</p>
    <div class="field" style="max-width:220px;"><label>Data</label><input type="date" id="zerarData" value="${todayISO()}"></div>
    <div id="zerarInfo" class="small muted mt8"></div>
    <button class="btn secondary" id="zerarBatidasBtn" style="margin-top:10px;border-color:var(--red);color:var(--red);">Zerar batidas desse dia</button>
  `;
  c.appendChild(panelZerar);

  function atualizarInfoZerar(){
    const dataISO = panelZerar.querySelector('#zerarData').value;
    const regs = registrosDoDia(dataISO).filter(r=>r.qr_entrada_batida_em || r.qr_saida_batida_em);
    panelZerar.querySelector('#zerarInfo').textContent = regs.length
      ? `${regs.length} lançamento(s) com alguma batida registrada em ${fmtDateBR(dataISO)}.`
      : `Nenhuma batida registrada em ${fmtDateBR(dataISO)}.`;
  }
  atualizarInfoZerar();
  panelZerar.querySelector('#zerarData').addEventListener('change', atualizarInfoZerar);

  panelZerar.querySelector('#zerarBatidasBtn').onclick = async ()=>{
    const dataISO = panelZerar.querySelector('#zerarData').value;
    const regs = registrosDoDia(dataISO).filter(r=>r.qr_entrada_batida_em || r.qr_saida_batida_em);
    if(!regs.length){ toast('Não há batidas para zerar nessa data.','warn'); return; }
    if(!confirm(`Zerar as batidas de entrada/saída de ${regs.length} lançamento(s) em ${fmtDateBR(dataISO)}? Essa ação não pode ser desfeita.`)) return;
    const btn = panelZerar.querySelector('#zerarBatidasBtn');
    btn.disabled = true; btn.textContent = 'Zerando...';
    let ok=0, falhou=0;
    for(const r of regs){
      const upd = await sbUpdate('historico_diarias', r.id, {qr_entrada_batida_em:null, qr_saida_batida_em:null});
      if(upd){ r.qr_entrada_batida_em=null; r.qr_saida_batida_em=null; ok++; } else { falhou++; }
    }
    btn.disabled = false; btn.textContent = 'Zerar batidas desse dia';
    toast(falhou? `${ok} zerada(s), ${falhou} falharam.` : `${ok} batida(s) zerada(s) com sucesso.`, falhou? 'warn':'ok');
    atualizarInfoZerar();
    if(currentView==='dashboard') navigate();
  };
}

/* ===================== BOOT ===================== */
function isDarkTheme(){
  return document.documentElement.getAttribute('data-tema')!=='claro';
}
function applyTheme(dark){
  if(dark) document.documentElement.removeAttribute('data-tema');
  else document.documentElement.setAttribute('data-tema','claro');
  const btn = document.getElementById('themeToggle');
  if(btn){ btn.textContent = dark ? '☀' : '☾'; btn.title = dark ? 'Versão clara' : 'Versão escura'; }
  try{ localStorage.setItem('kn-diaristas-tema', dark ? 'escuro' : 'claro'); }catch(e){}
}
document.getElementById('themeToggle').addEventListener('click', ()=>{
  applyTheme(!isDarkTheme());
});
(function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem('kn-diaristas-tema'); }catch(e){}
  applyTheme(saved !== 'claro');
})();
document.getElementById('cfgBtn').addEventListener('click', ()=>{
  currentView = currentView==='config' ? 'dashboard' : 'config'; fichaDiaristaId=null; navigate();
});
(function(){
  const b = document.getElementById('knBrand'); let n=0, t=null;
  b.addEventListener('click', ()=>{ n++; clearTimeout(t); t=setTimeout(()=>{ const q=n; n=0; if(q>=3) abrirAcesso(); else if(q===2 && isAdmin()) toggleExtras(); },450); });
  document.addEventListener('keydown', e=>{ if(e.ctrlKey && e.shiftKey && (e.key==='K'||e.key==='k')){ e.preventDefault(); abrirAcesso(); } });
})();
function markSync(ok){
  const el = document.getElementById('knLive'); if(!el) return;
  const hh = new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  el.className = 'live' + (ok ? '' : ' off');
  el.textContent = ok ? '● ao vivo · '+hh : '● sem conexão';
}

function atualizarBotaoAcesso(){
  const b = document.getElementById('acessoBtn'); if(!b) return;
  b.classList.toggle('admin', isAdmin());
  b.textContent = isAdmin() ? '🔓 Admin' : '🔒 Consulta';
  b.title = isAdmin() ? 'Administração ativa — clique para sair ou trocar a senha' : 'Somente consulta — clique para entrar com a senha';
}
function travarCamposConsulta(){
  if(isAdmin()) return;
  document.querySelectorAll('.dist-input,.abs-input').forEach(i=>{ i.readOnly=true; i.disabled=true; i.tabIndex=-1; });
}
new MutationObserver(()=>travarCamposConsulta()).observe(document.getElementById('content'),{childList:true,subtree:true});

async function abrirAcesso(){ return; /* versão somente leitura */
  const old = document.getElementById('acessoOverlay'); if(old) old.remove();
  const bg = document.createElement('div'); bg.id='acessoOverlay'; bg.className='modal-bg';
  let definida = true;
  if(!isAdmin()){
    const {data, error} = await sb.rpc('kn_dia_status');
    if(error){ toast('Não foi possível falar com o banco: '+error.message,'err'); return; }
    definida = !!(data && data.senha_definida);
  }
  const campo = (id, ph)=>`<div class="field"><label for="${id}">${ph}</label><input id="${id}" type="password" class="w100" autocomplete="off"></div>`;
  let corpo;
  if(isAdmin()){
    corpo = `<h3>Administração</h3><p class="muted small" style="margin:-4px 0 16px">Você pode editar, importar e apagar. Ao fechar o navegador, volta para consulta.</p>
      <div class="about-box" style="border:1px solid var(--line);border-radius:20px;padding:16px;background:var(--wash);margin-bottom:16px">
      <div class="label" style="font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);font-weight:600;margin-bottom:10px">Trocar senha</div>
      ${campo('acAtual','Senha atual')}${campo('acNova','Nova senha')}${campo('acNova2','Repita a nova senha')}
      <button class="btn secondary sm" id="acTrocar">Salvar nova senha</button></div>
      <div class="flex between"><button class="btn danger" id="acSair">Sair da administração</button><button class="btn secondary" id="acFechar">Fechar</button></div>`;
  } else if(!definida){
    corpo = `<h3>Criar senha</h3><p class="muted small" style="margin:-4px 0 16px">Primeiro acesso: defina a senha de administração. Ela fica guardada criptografada no banco, não no código.</p>
      ${campo('acNova','Nova senha (mín. 4 caracteres)')}${campo('acNova2','Repita a senha')}
      <div class="flex between"><button class="btn secondary" id="acFechar">Cancelar</button><button class="btn" id="acCriar">Criar e entrar</button></div>`;
  } else {
    corpo = `<h3>Entrar para editar</h3><p class="muted small" style="margin:-4px 0 16px">Sem senha o sistema fica só para consulta e downloads.</p>
      ${campo('acSenha','Senha')}<div id="acErro" class="small" style="color:var(--red);min-height:18px;margin:-6px 0 10px"></div>
      <div class="flex between"><button class="btn secondary" id="acFechar">Cancelar</button><button class="btn" id="acEntrar">Entrar</button></div>`;
  }
  bg.innerHTML = `<div class="modal" style="width:420px">${corpo}</div>`;
  document.body.appendChild(bg);
  const $ = s=>bg.querySelector(s);
  const fechar = ()=>bg.remove();
  bg.addEventListener('click', e=>{ if(e.target===bg) fechar(); });
  $('#acFechar').onclick = fechar;
  const entrarCom = s=>{ ADMIN_SENHA = s; try{ sessionStorage.setItem('kn-dia-s', s); }catch(e){} fechar(); toast('Administração liberada.','ok'); boot(); };
  if($('#acEntrar')){
    const inp = $('#acSenha'); inp.focus();
    const go = async ()=>{
      const s = inp.value; if(!s) return;
      $('#acEntrar').disabled = true;
      const {data, error} = await sb.rpc('kn_dia_login', {p_senha:s});
      $('#acEntrar').disabled = false;
      if(error){ $('#acErro').textContent = error.message; return; }
      if(data===true) entrarCom(s); else { $('#acErro').textContent = 'Senha incorreta.'; inp.select(); }
    };
    $('#acEntrar').onclick = go; inp.addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
  }
  if($('#acCriar')){
    $('#acNova').focus();
    $('#acCriar').onclick = async ()=>{
      const n = $('#acNova').value, n2 = $('#acNova2').value;
      if(n.length<4) return toast('A senha precisa ter pelo menos 4 caracteres.','warn');
      if(n!==n2) return toast('As senhas não conferem.','warn');
      const {data, error} = await sb.rpc('kn_dia_definir_senha', {p_atual:null, p_nova:n});
      if(error) return toast(error.message,'err');
      if(data===true) entrarCom(n); else toast('Já existe uma senha definida.','err');
    };
  }
  if($('#acTrocar')){
    $('#acTrocar').onclick = async ()=>{
      const a = $('#acAtual').value, n = $('#acNova').value, n2 = $('#acNova2').value;
      if(n.length<4) return toast('A nova senha precisa ter pelo menos 4 caracteres.','warn');
      if(n!==n2) return toast('As senhas novas não conferem.','warn');
      const {data, error} = await sb.rpc('kn_dia_definir_senha', {p_atual:a, p_nova:n});
      if(error) return toast(error.message,'err');
      if(data===true){ ADMIN_SENHA = n; try{ sessionStorage.setItem('kn-dia-s', n); }catch(e){} toast('Senha trocada.','ok'); fechar(); }
      else toast('Senha atual incorreta.','err');
    };
  }
  if($('#acSair')) $('#acSair').onclick = ()=>{ fechar(); sairAdmin(); };
}
document.getElementById('acessoBtn').addEventListener('click', abrirAcesso);
function areaVazia(t){
  if(!t || !t.closest) return false;
  if(t.closest('input,select,textarea,button,a,label,table,svg,img,canvas,.modal-bg,.nav-item,.tab,.pill,.reg-dia,.qr-item,.toast,.kn-toast,[contenteditable],h1,h2,h3,p,li')) return false;
  for(const n of t.childNodes){ if(n.nodeType===3 && n.textContent.trim()) return false; }
  return true;
}
document.addEventListener('dblclick', e=>{
  if(document.querySelector('.modal-bg')) return;
  if(!areaVazia(e.target)) return;
  try{ window.getSelection().removeAllRanges(); }catch(_){}
  abrirAcesso();
});

async function boot(){
  // Sempre começa a sessão sem dados em memória; os dados válidos vêm SOMENTE do Supabase novo.
  if(ADMIN_SENHA){
    try{ const {data} = await sb.rpc('kn_dia_login', {p_senha:ADMIN_SENHA}); if(data!==true){ ADMIN_SENHA=null; try{sessionStorage.removeItem('kn-dia-s');}catch(e){} } }catch(e){}
  }
  DIARISTAS = [];
  HISTORICO = [];
  IMPORTS = [];
  DIST_DIARIA = [];
  document.getElementById('content').innerHTML = '<div class="panel">Carregando dados do banco novo...</div>';
  [DIARISTAS, HISTORICO, IMPORTS, DIST_DIARIA] = await Promise.all([sbSelect('diaristas'), sbSelect('historico_diarias'), sbSelect('importacoes'), sbSelect('distribuicao_diaria')]);
  // Sincroniza cada lançamento do histórico com os dados MAIS ATUAIS do diarista
  // (nome, GROOT ID, empresa, cargo). O histórico guarda uma cópia desses dados no
  // momento do lançamento; se o cadastro for completado/corrigido depois (ex: GROOT ID
  // que faltava), essa cópia antiga ficaria desatualizada — aqui ela é sempre atualizada
  // com o que está no Banco de Diaristas, em todas as telas (Dashboard, Controle Diário,
  // Histórico, Relatórios).
  const diaristasPorId = {};
  DIARISTAS.forEach(d=>{ diaristasPorId[d.id] = d; });
  HISTORICO = HISTORICO.map(h=>{
    const atual = h.diarista_id ? diaristasPorId[h.diarista_id] : null;
    if(!atual) return h;
    return {
      ...h,
      nome: atual.nome || h.nome,
      groot_id: atual.groot_id || h.groot_id,
      empresa: atual.empresa || h.empresa,
      cargo: atual.cargo || h.cargo,
      cpf: atual.cpf || h.cpf,
    };
  });
  LOADED = true;
  markSync(true);
  // limpa registros de distribuição MELI/KN órfãos (sem nenhum lançamento correspondente no histórico)
  const orfaos = DIST_DIARIA.filter(d=>registrosDoDia(d.data).length===0 && !d.plantao_responsavel);
  for(const orfao of orfaos){
    const ok = await sbDelete('distribuicao_diaria', orfao.id);
    if(ok) DIST_DIARIA = DIST_DIARIA.filter(x=>x.id!==orfao.id);
  }
  navigate();
}
boot();

// Atualização automática (a cada 15s) do Dashboard e do Controle Diário/Faltas: busca de novo
// o histórico e as ABS lançadas — assim, quando alguém confirma entrada/saída pelo QR Diaristas
// ou registra uma ABS (dessa ou de outra sessão), a informação aparece aqui sozinha, sem precisar
// recarregar a página.
setInterval(async ()=>{
  if(!LOADED || (currentView!=='dashboard' && currentView!=='controle')) return;
  try{
    const freshHist = await sbSelect('historico_diarias');
    const diaristasPorId = {};
    DIARISTAS.forEach(d=>{ diaristasPorId[d.id] = d; });
    HISTORICO = freshHist.map(h=>{
      const atual = h.diarista_id ? diaristasPorId[h.diarista_id] : null;
      if(!atual) return h;
      return {
        ...h,
        nome: atual.nome || h.nome,
        groot_id: atual.groot_id || h.groot_id,
        empresa: atual.empresa || h.empresa,
        cargo: atual.cargo || h.cargo,
        cpf: atual.cpf || h.cpf,
      };
    });
    markSync(true);
    if(currentView==='dashboard' || currentView==='controle') navigate();
  }catch(e){ markSync(false); /* tenta de novo no próximo ciclo */ }
}, 15000);

if(window.parent !== window){
  window.addEventListener('message', (e)=>{
    const d = e.data;
    if(d && d.app==='painel-kn' && d.action==='navigate' && VIEWS.some(v=>v.id===d.target)){
      currentView = d.target;
      fichaDiaristaId = null;
      navigate();
    }
  });
}
</script>
